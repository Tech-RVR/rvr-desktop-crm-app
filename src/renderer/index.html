<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://crm.rvrratingpartners.co.uk https://n8n.rvrratingpartners.co.uk;">
<title>RVR Ratings CRM</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<div id="login-screen"></div>

<div class="app" id="app-shell" style="display:none;">
  <div class="topbar">
    <div class="logo">RVR <span>Ratings</span> CRM</div>
    <div class="right">
      <span class="user-chip" id="topbar-user"></span>
      <div id="topbar-clock-widget"></div>
      <button id="topbar-feedback">Feedback</button>
      <div class="avatar" id="topbar-avatar"></div>
    </div>
  </div>
  <aside class="sidebar">
    <div class="section">Workspace</div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button id="sidebar-logout">Log out</button>
    </div>
  </aside>
  <div class="main-col">
    <div id="module-content"></div>
  </div>
</div>

<div class="modal-backdrop" id="clock-modal-backdrop">
  <div class="modal">
    <h2>Clock In / Out</h2>
    <div class="field">
      <label>Visit type</label>
      <div class="toggle-group" id="clock-type-toggle">
        <button type="button" class="toggle-btn active" data-type="office">Office</button>
        <button type="button" class="toggle-btn" data-type="field">Field</button>
      </div>
    </div>
    <div class="field" id="clock-case-field" style="display:none;">
      <label for="clock-case-select">Which case are you at?</label>
      <select id="clock-case-select"><option value="">Loading your cases…</option></select>
    </div>
    <div class="status-banner" id="clock-status"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="clock-cancel">Cancel</button>
      <button class="btn btn-secondary" id="clock-out-submit">Clock Out</button>
      <button class="btn btn-primary" id="clock-in-submit">Clock In</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="feedback-modal-backdrop">
  <div class="modal">
    <h2>Send feedback</h2>
    <div class="field">
      <label for="feedback-type">Type</label>
      <select id="feedback-type">
        <option value="Bug">Bug</option>
        <option value="Feature Request">Feature Request</option>
        <option value="Something else">Something else</option>
      </select>
    </div>
    <div class="field">
      <label for="feedback-message">Message</label>
      <textarea id="feedback-message" placeholder="What's on your mind?"></textarea>
    </div>
    <div class="status-banner" id="feedback-status"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="feedback-cancel">Cancel</button>
      <button class="btn btn-primary" id="feedback-submit">Send</button>
    </div>
  </div>
</div>

<script src="shared/stage-badge.js"></script>
<script src="modules/dashboard.js"></script>
<script src="modules/claim-pool.js"></script>
<script src="modules/cases.js"></script>
<script src="modules/pipeline.js"></script>
<script src="modules/contacts.js"></script>
<script src="modules/case-detail.js"></script>
<script src="modules/case-new.js"></script>
<script src="app.js"></script>
</body>
</html>
