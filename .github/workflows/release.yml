name: Build & Release

# Builds Windows and macOS installers in one pipeline off a version tag push
# (e.g. `git tag v0.1.0 && git push --tags`), and attaches them to a GitHub
# Release. electron-updater (wired in src/main/main.js) checks this repo's
# Releases feed for auto-updates.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        # electron-builder publishes straight to the GitHub Release matching
        # the pushed tag when GH_TOKEN is set. Code signing is not yet
        # configured (see README) — unsigned builds are fine for this
        # 3-4 person internal tool; staff on macOS use right-click > Open
        # the first time, and Windows SmartScreen shows a clickable warning.
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
